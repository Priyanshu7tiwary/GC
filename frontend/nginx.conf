# Runs as the unprivileged nginx user on port 8080 (see Dockerfile).
server_tokens off;

# Basic abuse protection for the API (the backend adds stricter per-route limits for sign-in).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# The port the browser used (e.g. 3000), so the API can tell same-origin requests apart from cross-site ones.
map $http_host $client_port {
    "~:(?<p>[0-9]+)$" $p;
    default           80;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # ---- security headers for every response ----
    # Scripts: only our own bundle and Google's sign-in library. No inline scripts, no eval.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Google's sign-in popup needs to talk back to this window.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # Turn on once the site is served over HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # keep the port: Spring compares Origin with Host to recognise same-origin requests
        proxy_set_header Host $http_host;
        # overwrite, never append, so clients can't spoof their IP for rate limiting
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $client_port;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 30s;
    }

    # Actuator and API docs are never exposed through the public entry point.
    location /actuator/ { return 404; }
    location /swagger-ui/ { return 404; }
    location /v3/ { return 404; }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Figures used in previous-year questions (the papers themselves come from the API). A missing file must be a 404,
    # not the SPA's index.html.
    location /pyq/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~ /\. { deny all; return 404; }

    # Single-page app: unknown paths fall back to index.html, which is never cached.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        try_files $uri $uri/ /index.html;
    }
}
