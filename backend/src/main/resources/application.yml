spring:
  application:
    name: catalyst-api
  datasource:
    # either a full JDBC URL in DB_URL, or the parts (handy on hosts like Render that hand out host/port/name separately)
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalyst}${DB_PARAMS:}}
    username: ${DB_USER:catalyst}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  mail:
    # leave SMTP_HOST empty to log codes to the console instead of emailing them (development only)
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100

server:
  port: ${PORT:8080}
  # trust X-Forwarded-* only from the reverse proxy (private network addresses), so rate limits see the real client IP
  forward-headers-strategy: native
  server-header: ""
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel.enabled: false
  tomcat:
    max-swallow-size: 256KB
    max-http-form-post-size: 256KB

app:
  jwt:
    # required, at least 32 bytes: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:PT12H}
  cookie:
    # keep true outside plain-http local testing; browsers accept Secure cookies on http://localhost
    secure: ${COOKIE_SECURE:true}
  mail:
    from: ${MAIL_FROM:99ile <no-reply@99ile.local>}
  google:
    # OAuth 2.0 Web client ID from Google Cloud Console; leave empty to hide Google sign-in
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    # empty = same-origin only (the default for Docker and Vite dev, which proxy /api)
    allowed-origins: ${CORS_ORIGINS:}
  exam:
    default-target-percentile: 99
  generator:
    # questions per section in an AI-generated mock
    questions-per-section: ${GENERATOR_QUESTIONS_PER_SECTION:22}
    # brand-new questions Claude drafts per QA / VARC section (needs ANTHROPIC_API_KEY); 0 turns drafting off
    ai-questions-per-section: ${GENERATOR_AI_QUESTIONS_PER_SECTION:3}
  suggestion-ai:
    # Any OpenAI-compatible chat API. Default: Groq's free tier, which serves open-weight models such as OpenAI's gpt-oss
    # (key from https://console.groq.com/keys). Leave the key empty to keep the built-in rule-based suggestions.
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
    model: ${AI_MODEL:openai/gpt-oss-120b}
    # AI plans one learner may generate per rolling 7 days
    weekly-limit: ${AI_WEEKLY_LIMIT:3}
  ai:
    # Anthropic API key; leave empty to build mocks from the stored question pool only
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5-5}
  # comma-separated verified emails that may correct answer keys (in addition to users.is_admin)
  admin-emails: ${ADMIN_EMAILS:}

management:
  endpoints.web.exposure.include: health
  endpoint.health:
    probes.enabled: true
    show-details: never
  info.env.enabled: false

springdoc:
  api-docs.enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html
